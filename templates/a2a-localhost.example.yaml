# EXAMPLE ONLY. Hermes has native A2A support; this does not install or start it.
# With no bearer token, Hermes binds the A2A server to loopback (127.0.0.1).
# Remote exposure requires per-peer authentication, a trusted-peer allowlist,
# and an explicit A2A_HOST. Do not widen the bind host without approval.

gateway:
  platforms:
    a2a:
      enabled: true
      extra:
        port: 9900

# Configure A2A_PEER_TOKENS and A2A_TRUSTED_PEERS in the appropriate
# secret/config store before remote exposure. Never commit token values.
# Do not expose terminal/file-capable profiles to unknown peers.
